name: Deploy Docker image to Google Cloud Run

on:
  push:
    branches:
      - dev

env:
  GCP_REGION: us-south1
  GCP_PROJECT_ID: elite-partition-456412-u6
  DOCKER_NAME: py-backend
  SERVICE_ACCOUNT: lacal-to-cloudrun@elite-partition-456412-u6.iam.gserviceaccount.com
  DOCKER_IMAGE_PATH: us-south1-docker.pkg.dev/elite-partition-456412-u6/demoregistry

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Configure Docker to use gcloud credentials
      run: |
        gcloud auth configure-docker ${{env.GCP_REGION}}-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t ${{ env.DOCKER_IMAGE_PATH }}/${{env.DOCKER_NAME}}:${{ github.run_number }} .

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ env.DOCKER_IMAGE_PATH }}/${{env.DOCKER_NAME}}:${{ github.run_number }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy py-backend \
        --image= ${{env.DOCKER_IMAGE_PATH}} \
        --platform=managed \
        --region= ${{env.GCP_REGION}} \
        --service-account= ${{env.SERVICE_ACCOUNT}} \
        --allow-unauthenticated \
        --min-instances=1 \
        --max-instances=2 \
        --memory=512Mi \
        --cpu=1
